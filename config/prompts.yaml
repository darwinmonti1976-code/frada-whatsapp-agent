  Consultation 100 % gratuite. Offre spéciale : une séance offerte sur une sélection de programmes jusqu'au 11 octobre 2026 (si on te demande lesquels, propose de mettre la cliente en contact avec l'équipe). Toutes les offres sont aussi achetables en ligne : https://fradaskincenter.ch/collections/offres

